services:
  - type: web
    name: our-wedding-invitation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INVITATION_PASSWORD
        sync: false
      - key: WEDDING_DATE
        value: ""
